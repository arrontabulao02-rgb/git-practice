<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Sign in | Git Practice</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f3f6fb;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(100%, 440px);
            padding: 40px;
            border: 1px solid #e4e9f2;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 18px 50px rgb(28 47 82 / 9%);
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            margin-bottom: 24px;
            border-radius: 12px;
            background: #eaf0ff;
            color: #315bd6;
            font-size: 23px;
            font-weight: 750;
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            letter-spacing: -0.04em;
        }

        .intro {
            margin: 9px 0 28px;
            color: #667085;
            line-height: 1.55;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 650;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            min-height: 48px;
            padding: 0 14px;
            border: 1px solid #cfd6e2;
            border-radius: 8px;
            background: #fff;
            color: inherit;
            font: inherit;
        }

        input:focus-visible,
        a:focus-visible,
        button:focus-visible {
            outline: 3px solid rgb(49 91 214 / 28%);
            outline-offset: 2px;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #315bd6;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 2px 0 23px;
            font-size: 0.88rem;
        }

        .remember-option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: #475467;
            font-weight: 450;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #315bd6;
        }

        a {
            color: #315bd6;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            min-height: 49px;
            border: 0;
            border-radius: 8px;
            background: #315bd6;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 650;
        }

        button:hover {
            background: #264bb9;
        }

        .signup {
            margin: 23px 0 0;
            color: #667085;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">G</div>
        <h1>Welcome back</h1>
        <p class="intro">Sign in to continue to your account.</p>

        <form action="/login" method="post" accept-charset="UTF-8">
            <div class="field">
                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    inputmode="email"
                    autocapitalize="none"
                    spellcheck="false"
                    required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required>
            </div>

            <div class="form-options">
                <label class="remember-option" for="remember">
                    <input id="remember" name="remember" type="checkbox" value="1">
                    Remember me
                </label>
                <a href="/forgot-password">Forgot password?</a>
            </div>

            <button type="submit">Sign in</button>
        </form>

        <p class="signup">Don’t have an account? <a href="/register">Create one</a></p>
    </main>
</body>
</html>
